  { const box=document.createElement('div'); box.style.cssText='display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #9aa;border-radius:6px;padding:4px 10px;font-size:13px';
    const inp=document.createElement('input'); inp.type='color'; inp.title='Color de la carcasa';
    const sl=['R','G','B'].map(n=>{const r=document.createElement('input'); r.type='range'; r.min=0; r.max=255; r.style.width='64px'; r.title=n; return r;});
    const hex=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
    function setCol(c){ curColor=c; applyColor(c); inp.value=c; const n=parseInt(c.slice(1),16); sl[0].value=(n>>16)&255; sl[1].value=(n>>8)&255; sl[2].value=n&255;
      try{ history.replaceState(null,'','#'+new URLSearchParams({case:state.case,view:state.view,explode:state.explode,color:c.slice(1)}).toString()); }catch(e){} }
    inp.oninput=()=>setCol(inp.value); sl.forEach(r=>r.oninput=()=>setCol(hex(+sl[0].value,+sl[1].value,+sl[2].value)));
    box.append('Color carcasa ',inp,' R',sl[0],' G',sl[1],' B',sl[2]); ui.appendChild(box); setCol(curColor); }
}
document.getElementById('info').innerHTML=`<b>${Q.outer.toFixed(1)}×${Q.outer.toFixed(1)}×${Q.depth.toFixed(2)} mm</b> · PCB Rev C 84×84 · 3 relés HF115F · DWIN 4" F040 blanca, girada 180° y enchufada a J6<br>Componentes hacia atrás («Trasera» + «Sin carcasa») · tabique 230 V/SELV en rojo · lámina aislante en ámbar · cápsula SHT40 20×20×3<br>Interferencias: ${SCENE.problems.length? SCENE.problems.join('; ') : 'ninguna'} · FPC doblado: ${Object.entries(SCENE.fpc_clearance).map(([k,v])=>k+' '+v[0]+' mm ('+v[1]+')').join(', ')} · PRELIMINAR: confirmar plano de DWIN`;
if(!state.ui) document.getElementById('info').style.display='none';
