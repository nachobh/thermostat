{ const nx=Q.node_x, ny=Q.node_y;

    box.append('Color carcasa ',inp,' R',sl[0],' G',sl[1],' B',sl[2]); ui.appendChild(box); setCol(curColor); }
}
document.getElementById('info').innerHTML=`<b>${Q.outer_w}×${Q.outer_h}×${Q.depth.toFixed(1)} mm</b> · sin tapa frontal: pantalla DWIN 5,7" pegada sobre el borde de las paredes<br>Carcasa ${Q.disp_z0} mm + pantalla ${Q.disp_t} mm · sin potenciómetro · 3 relés HF115F<br>PRELIMINAR: confirmar plano mecánico de DWIN`;
if(!state.ui) document.getElementById('info').style.display='none';
</script>
