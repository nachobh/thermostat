<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termostato v5 – render 3D</title>
<style>
  html,body{margin:0;height:100%;background:#eef1f5;font-family:system-ui,sans-serif;color:#222}
  #ui{position:fixed;top:10px;left:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 20px);z-index:2}
  #ui button{border:1px solid #9aa;background:#fff;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  #ui button.on{background:#1f5fbf;color:#fff;border-color:#1f5fbf}
  #info{position:fixed;bottom:10px;left:10px;background:#fffd;border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.5;z-index:2}
  canvas{display:block}
</style>
</head>
<body>
<div id="ui"></div><div id="info"></div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
window.onerror=(m,u,l)=>{document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;top:40px;left:10px;color:#b00;z-index:9;background:#fff">'+m+' @'+l+'</pre>')};
const SCENE = __SCENE__;
const Q = SCENE.Q, F = SCENE.FRONT, V = SCENE.VENTS, A = SCENE.AREAS;
const q = new URLSearchParams(location.hash.slice(1));
const state = { case: q.get('case')||'solid', view: q.get('view')||'iso', explode: parseFloat(q.get('explode')||'0'), ui: q.get('ui')!=='0' };
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); renderer.setClearColor(0xeef1f5);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 1, 4000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(200, 320, 400); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(-300, -80, 200); scene.add(fill);
const M = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:0.6, metalness:0.05, side:THREE.DoubleSide}, o));
function box(w,h,d,mat,x,y,z,parent){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); parent.add(m); return m; }
function cyl(r,len,mat,x,y,z,axis,parent,seg=32){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg),mat);
  if(axis==='z') m.rotation.x=Math.PI/2; else if(axis==='x') m.rotation.z=Math.PI/2; m.position.set(x,y,z); parent.add(m); return m; }
const XY = new THREE.Matrix4().makeBasis(new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1));
const XZ = new THREE.Matrix4().makeBasis(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,1), new THREE.Vector3(0,1,0));
const YZ = new THREE.Matrix4().makeBasis(new THREE.Vector3(0,0,1), new THREE.Vector3(0,1,0), new THREE.Vector3(1,0,0));
function plate(basis,u0,u1,v0,v1,t,holes,mat,x,y,z,parent,circles=[]){
  const sh=new THREE.Shape(); sh.moveTo(u0,v0); sh.lineTo(u1,v0); sh.lineTo(u1,v1); sh.lineTo(u0,v1); sh.closePath();
  holes.forEach(h=>{const p=new THREE.Path(); p.moveTo(h[0],h[2]); p.lineTo(h[0],h[3]); p.lineTo(h[1],h[3]); p.lineTo(h[1],h[2]); p.closePath(); sh.holes.push(p);});
  circles.forEach(c=>{const p=new THREE.Path(); p.absarc(c[0],c[1],c[2],0,Math.PI*2,true); sh.holes.push(p);});
  const g=new THREE.ExtrudeGeometry(sh,{depth:t,bevelEnabled:false}); g.applyMatrix4(basis);
  const m=new THREE.Mesh(g,mat); m.position.set(x,y,z); parent.add(m); return m;
}
const gShell=new THREE.Group(), gPCB=new THREE.Group(), gDeck=new THREE.Group(), gCover=new THREE.Group(), gLid=new THREE.Group(), gMods=new THREE.Group();
scene.add(gShell,gPCB,gDeck,gCover,gLid,gMods);
const HW=Q.outer/2, IW=Q.inner/2, W=Q.wall, Z=Q.lid_in;
const glass = state.case==='glass';
const COL0 = /^[0-9a-fA-F]{6}$/.test(q.get('color')||'') ? '#'+q.get('color') : '#b4bbc7';
let curColor = COL0;
const shMat = glass ? M(COL0,{transparent:true,opacity:0.25,depthWrite:false}) : M(COL0,{roughness:0.55});
const lidMat = glass ? M(COL0,{transparent:true,opacity:0.25,depthWrite:false}) : M(COL0,{roughness:0.5});
const barMat = M(0x6f747c,{roughness:0.6});
const [nx,ny] = F.node;

/* ---------- caja ---------- */
plate(XY,-HW,HW,-HW,HW,W,[],shMat,0,0,0,gShell);
plate(XZ,-HW,HW,0,Z,W,V.top,shMat,0,IW,0,gShell);
plate(XZ,-HW,HW,0,Z,W,V.bottom_dht,shMat,0,-HW,0,gShell);
plate(YZ,0,Z,-HW,HW,W,V.side_dht,shMat,-HW,0,0,gShell);
plate(YZ,0,Z,-HW,HW,W,V.side_pow.concat([[28,34,ny-6,ny+6]]),shMat,IW,0,0,gShell);          // lateral dcha.: entrada de aire + USB
[-1,1].forEach(sx=>[-1,1].forEach(sy=>{
  const h=Q.pcb/2-Q.hole_off; cyl(3.0,Q.standoff,M(0xe0b050),sx*h,sy*h,Q.floor+Q.standoff/2,'z',gShell,24);
  cyl(3.2,Z-11.5,M(0xaeb4bc),sx*50.5,sy*50.5,11.5+(Z-11.5)/2,'z',gShell,20);                      // columnas de la tapa
}));
/* ---------- PCB SELV ---------- */
const zb=Q.pcb_z, zt=Q.pcb_top;
box(Q.pcb,Q.pcb,Q.pcb_t,M(0x1f6b3a,{roughness:0.45}),0,0,zb+Q.pcb_t/2,gPCB);
SCENE.parts.forEach(p=>{const x=p.x-50,y=p.y-50;
  if(p.t==='jst'){const w=(p.n-1)*2.5+4.9; box(w,5.75,7,M(0xf2ecd9),x,y,zt+3.5,gPCB); box(w-1.6,3.2,0.3,M(0x3a3a3a),x,y,zt+7.05,gPCB);}
  else if(p.t==='phoenix'){box(10.16,9.8,10.5,M(0x2f9a52),x,y,zt+5.25,gPCB); box(0.4,7,5,M(0x151515),x+5.0,y,zt+4.5,gPCB);}
  else if(p.t==='res'){cyl(1.15,6.3,M(0xd9b97a),x,y,zt+1.4,'x',gPCB,16);}
  else if(p.t==='elec'){cyl(2.5,11,M(0x1b1b1b),x,y,zt+5.5,'z',gPCB,24);}
  else if(p.t==='cer'){box(5,2.5,6,M(0xe0a020),x,y,zt+3,gPCB);}
  else if(p.t==='to92'){cyl(1.4,5,M(0x1a1a1a),x,y,zt+3.5,'z',gPCB,20);}
  else if(p.t==='ptc'){box(7.4,3.8,9,M(0xe8d34a),x,y,zt+4.5,gPCB);}
});
/* ---------- cubierta (bandeja completa) ---------- */
const slotsA=[[-45,-5,-8,0],[5,45,-8,0]];
plate(XY,-52.8,52.8,-52.8,52.8,Q.tray_t,slotsA,barMat,0,0,Q.tray_z0,gDeck);
plate(XZ,-52.8,52.8,Q.tray_z0,Q.cover_z0,Q.part_t,[[34,46,28,35]],barMat,0,Q.part_y0,0,gDeck);          // partición + paso del mazo de 5 V
// NodeMCU invertido sobre 4 apoyos (ESP-12 hacia abajo, regletas y conectores hacia arriba)
[[-26,-12.5],[26,-12.5],[-26,12.5],[26,12.5]].forEach(([dx,dy])=>box(6,6,Q.node_pad,M(0xd9d9d9),nx+dx,ny+dy,Q.deck_z+Q.node_pad/2,gDeck));
{ const zB=Q.node_zb+0.8;
  box(Q.node_l,Q.node_w,1.6,M(0x1b2f78,{roughness:0.4}),nx,ny,zB,gMods);
  box(16,12,3,M(0xc8ccd2,{metalness:0.8,roughness:0.3}),nx+6,ny,Q.node_zb-1.5,gMods);       // ESP-12 (hacia abajo; antena a la dcha. = invertido)
  box(8,6,2.8,M(0xb9bec4,{metalness:0.85,roughness:0.3}),nx+25,ny,Q.node_zb-1.4,gMods);     // micro-USB hacia la pared dcha.
  [-1,1].forEach(s=>{box(38.1,2.5,Q.node_pin,M(0x151515),nx-2,ny+s*11.43,Q.node_zb+1.6+Q.node_pin/2,gMods);
                     box(38.1,2.9,Q.node_plug,M(0x2a2a2a),nx-2,ny+s*11.43,Q.node_zb+1.6+Q.node_pin+Q.node_plug/2,gMods);}); }
// DHT22 plano con deflector
{ const [x,y]=F.dht;
  box(Q.dht_w,Q.dht_l,1.6,M(0x2c4f9a),x,y,Q.deck_z+0.8,gMods);
  box(Q.dht_w,Q.dht_l-5,Q.dht_t,M(0xf2f2f2),x,y-2,Q.deck_z+1.6+Q.dht_t/2,gMods);
  box(1.5,29,18,M(0x9fc4e8,{transparent:true,opacity:0.45,depthWrite:false}),-33,ny+2,Q.deck_z+9,gMods); }
/* ---------- bolsa de 230 V ---------- */
[[-43,-11],[43,-11],[-43,11],[43,11]].forEach(([dx,dy])=>cyl(2.5,Q.mb_post,M(0xd9d9d9),dx,Q.mb_y+dy,Q.deck_z+Q.mb_post/2,'z',gDeck,12));
box(Q.mb_w,Q.mb_h,Q.mb_t,M(0x2f7a46,{roughness:0.45}),0,Q.mb_y,Q.mb_z0+Q.mb_t/2,gDeck);
Q.rel_x.forEach(xs=>{
  box(Q.rel_l,Q.rel_w,Q.rel_h,M(0x2b4f9a,{roughness:0.4}),xs,Q.rel_y,Q.rel_z0+Q.rel_h/2,gDeck);
  box(Q.rel_l-6,Q.rel_w-3,0.3,M(0xe8e8e8),xs,Q.rel_y,Q.rel_z1+0.1,gDeck);
  [-9,-4].forEach(dx=>cyl(0.5,3,M(0xc9ced4,{metalness:0.8}),xs+dx,Q.rel_y-Q.rel_w/2-3,Q.rel_z0+1.5,'z',gDeck,8));
  cyl(1.0,5,M(0x222222),xs-6.5,Q.rel_y-Q.rel_w/2-3,Q.rel_z0+4,'x',gDeck,10);
});
{ const L=Q.strip_n*Q.strip_pitch; box(L,Q.strip_w,Q.strip_h,M(0x4a8a3c),0,Q.strip_y,Q.mb_z0+Q.mb_t+Q.strip_h/2,gDeck);
  for(let i=0;i<Q.strip_n;i++) cyl(1.8,1,M(0xb9bec4,{metalness:0.8}),-L/2+Q.strip_pitch*(i+0.5),Q.strip_y,Q.mb_z0+Q.mb_t+Q.strip_h+0.2,'z',gDeck,16); }
plate(XY,-52.8,52.8,Q.pocket_y0,52.8,Q.cover_t,[],barMat,0,0,Q.cover_z0,gCover);                         // cubierta de la bolsa
/* ---------- pantalla, tapa y potenciómetro ---------- */
const dcx=Q.disp_cx, dcy=Q.disp_cy, ww=Q.act_w+2*Q.win_pad, wh=Q.act_h+2*Q.win_pad;
box(Q.disp_w,Q.disp_h,Q.disp_t,M(0x111111),dcx,dcy,Q.disp_z0+Q.disp_t/2,gMods);
function uiTexture(){const c=document.createElement('canvas');c.width=512;c.height=512;const g=c.getContext('2d');g.fillStyle='#0b1830';g.fillRect(0,0,512,512);
  g.fillStyle='#9fe8ff';g.font='bold 120px sans-serif';g.textAlign='center';g.fillText('22.5°C',256,230);g.font='34px sans-serif';g.fillText('Consigna 21.0 · HEAT',256,290);g.fillText('Hum 45 % · WiFi OK',256,340);
  g.strokeStyle='#2a4a7a';g.lineWidth=3;g.strokeRect(40,400,200,70);g.strokeRect(272,400,200,70);g.font='32px sans-serif';g.fillText('MODO',140,447);g.fillText('AJUSTE',372,447);return new THREE.CanvasTexture(c);}
{ const scr=new THREE.Mesh(new THREE.PlaneGeometry(Q.act_w,Q.act_h),new THREE.MeshBasicMaterial({map:uiTexture()})); scr.position.set(dcx,dcy,Z+0.05); gMods.add(scr); }
plate(XY,-HW,HW,-HW,HW,Q.lid_t,[[dcx-ww/2,dcx+ww/2,dcy-wh/2,dcy+wh/2]],lidMat,0,0,Z,gLid,[[F.pot[0],F.pot[1],Q.pot_hole/2]]);
{ const [x,y]=F.pot;
  cyl(Q.pot_body/2,Q.pot_len,M(0x8a8f96,{metalness:0.4}),x,y,Z-Q.pot_len/2,'z',gMods,32);
  cyl(Q.pot_hole/2-0.1,Q.lid_t+3,M(0xb9bec4,{metalness:0.85}),x,y,Z+(Q.lid_t+3)/2-0.5,'z',gMods,24);
  cyl(Q.knob_d/2,Q.knob_h-1,M(0x2b2f36,{roughness:0.5}),x,y,Z+Q.lid_t+1+(Q.knob_h-1)/2,'z',gMods,48);
  box(1.2,Q.knob_d/2-3,0.4,M(0xffffff),x,y+Q.knob_d/4+1,Z+Q.lid_t+Q.knob_h+0.1,gMods); }
/* ---------- visibilidad / despiece / cámara ---------- */
const e=state.explode;
gShell.visible=gLid.visible=gCover.visible=state.case!=='off';
gLid.position.z=e*70; gMods.position.z=0; gCover.position.z=e*45; gDeck.position.z=e*15;
const my=0, mz=(Q.depth+Q.knob_h)/2-8;
const views={ iso:[190,150,330], front:[0,0,540], side:[540,0,mz], back:[-200,160,-330] };
function setView(v){const a=views[v]||views.iso; const k=(v==='iso'&&e)?1.4:1;
  camera.position.set(a[0]*k,a[1]*k,mz+(a[2]-mz)*k); camera.up.set(0,1,0); controls.target.set(0,my,mz); controls.update();}
function loop(){requestAnimationFrame(loop);renderer.render(scene,camera);}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
setView(state.view); renderer.render(scene,camera); loop();
if(q.get('snap')==='1'){const im=new Image(); im.style.cssText='position:fixed;inset:0;width:100%;height:100%'; im.src=renderer.domElement.toDataURL('image/png'); document.body.appendChild(im);}
function applyColor(c){ shMat.color.set(c); if(typeof lidMat!=='undefined') lidMat.color.set(c); }
function apply(next){location.hash=new URLSearchParams({case:state.case,view:state.view,explode:state.explode,color:curColor.slice(1),...next}).toString();location.reload();}
if(state.ui){const ui=document.getElementById('ui');
  const btn=(l,on,f)=>{const b=document.createElement('button');b.textContent=l;if(on)b.className='on';b.onclick=f;ui.appendChild(b);};
  btn('Con carcasa',state.case==='solid',()=>apply({case:'solid'})); btn('Carcasa transparente',glass,()=>apply({case:'glass'})); btn('Sin carcasa',state.case==='off',()=>apply({case:'off'}));
  btn('Despiece',e>0,()=>apply({explode:e>0?0:1}));
  ['iso','front','side','back'].forEach(v=>btn({iso:'Isométrica',front:'Frontal',side:'Lateral',back:'Trasera'}[v],state.view===v,()=>apply({view:v})));
  { const box=document.createElement('div'); box.style.cssText='display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #9aa;border-radius:6px;padding:4px 10px;font-size:13px';
    const inp=document.createElement('input'); inp.type='color'; inp.title='Color de la carcasa';
    const sl=['R','G','B'].map(n=>{const r=document.createElement('input'); r.type='range'; r.min=0; r.max=255; r.style.width='64px'; r.title=n; return r;});
    const hex=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
    function setCol(c){ curColor=c; applyColor(c); inp.value=c; const n=parseInt(c.slice(1),16); sl[0].value=(n>>16)&255; sl[1].value=(n>>8)&255; sl[2].value=n&255;
      try{ history.replaceState(null,'','#'+new URLSearchParams({case:state.case,view:state.view,explode:state.explode,color:c.slice(1)}).toString()); }catch(e){} }
    inp.oninput=()=>setCol(inp.value); sl.forEach(r=>r.oninput=()=>setCol(hex(+sl[0].value,+sl[1].value,+sl[2].value)));
    box.append('Color carcasa ',inp,' R',sl[0],' G',sl[1],' B',sl[2]); ui.appendChild(box); setCol(curColor); }
}
document.getElementById('info').innerHTML=`<b>Caja ${Q.outer}×${Q.outer}×${Q.depth.toFixed(1)} mm</b> (+${Q.knob_h} del mando) · pantalla DWIN 4" 480×480 · 3 relés HF115F<br>Pantalla ${Q.disp_w}×${Q.disp_h}×${Q.disp_t} (supuesta) · ventilación pasiva: techo ${A.salida.toFixed(0)} cm² · laterales ${A.entrada.toFixed(0)} cm²<br>PRELIMINAR: confirmar plano mecánico de DWIN`;
if(!state.ui) document.getElementById('info').style.display='none';
</script>
</body>
</html>
